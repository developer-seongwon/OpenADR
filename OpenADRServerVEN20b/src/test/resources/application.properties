# ===============================
# = OADR VEN CONFIG
# ===============================

# 테스트가 실제로 서버 소켓을 연다. 8000 번대는 흔히 쓰는 대역이라
# 개발 중인 다른 앱과 부딪혀서 Port is already in use 로 테스트가 통째로 깨진다.
# 잘 안 쓰는 18000 번대로 옮겼다.
# OadrMockMvc 가 요청 URL 에 포트를 박아 쓰므로 그쪽도 같이 맞춰야 한다.

oadr.pullFrequencySeconds 5
oadr.reportOnly false
oadr.xmlSignature false
oadr.pullModel false
oadr.security.replayProtectAcceptedDelaySecond 1200

oadr.vtn.myvtn.vtnid=04:D0:20:52:32:23:6A:1F:73:E2
oadr.vtn.myvtn.vtnUrl=https://localhost:8181
oadr.vtn.myvtn.venName = oadr-ven.avob.com
oadr.vtn.myvtn.server.port = 18081
oadr.vtn.myvtn.venUrl https://localhost:18081
oadr.vtn.myvtn.venid = 2E:55:12:81:B9:EE:9C:46:72:1D
oadr.vtn.myvtn.security.vtn.trustcertificate src/test/resources/rsa/vtn/TEST_OpenADR_RSA_SPCA0002_Cert.pem,src/test/resources/rsa/vtn/TEST_OpenADR_RSA_RCA0002_Cert.pem,src/test/resources/ecc/vtn/TEST_OpenADR_ECC_Root_CA3_cert.pem,src/test/resources/ecc/vtn/TEST_OpenADR_ECC_SHA256_VTN_Int_CA3_cert.pem
oadr.vtn.myvtn.security.ven.key src/test/resources/rsa/ven/TEST_RSA_VEN_17032333409_privkey.pem
oadr.vtn.myvtn.security.ven.cert src/test/resources/rsa/ven/TEST_RSA_VEN_17032333409_cert.pem

oadr.vtn.myxmppvtn.vtnid=04:D0:20:52:32:23:6A:1F:73:E3
oadr.vtn.myxmppvtn.xmpp.host=vtn.oadr.com
oadr.vtn.myxmppvtn.xmpp.port=5222

oadr.vtn.myxmppvtn.venName = oadr-ven.avob.com
oadr.vtn.myxmppvtn.server.port = 18082
oadr.vtn.myxmppvtn.venUrl https://localhost:18082
oadr.vtn.myxmppvtn.venid = 2E:55:12:81:B9:EE:9C:46:72:1D
oadr.vtn.myxmppvtn.security.vtn.trustcertificate src/test/resources/rsa/vtn/TEST_OpenADR_RSA_SPCA0002_Cert.pem,src/test/resources/rsa/vtn/TEST_OpenADR_RSA_RCA0002_Cert.pem,src/test/resources/ecc/vtn/TEST_OpenADR_ECC_Root_CA3_cert.pem,src/test/resources/ecc/vtn/TEST_OpenADR_ECC_SHA256_VTN_Int_CA3_cert.pem
oadr.vtn.myxmppvtn.security.ven.key src/test/resources/rsa/ven/TEST_RSA_VEN_17032333409_privkey.pem
oadr.vtn.myxmppvtn.security.ven.cert src/test/resources/rsa/ven/TEST_RSA_VEN_17032333409_cert.pem

# Boot 2.6 부터 빈 사이 순환 참조가 기본으로 막혔다.
# VEN20b 는 multiVtnConfig, xmppVenListener, oadr20bVENPayloadService,
# VEN20bEventServiceConfig, oadr20bVENEiEventService 가 고리를 이루고 있어서
# 그대로는 컨텍스트가 뜨지 않는다.
# 예전 동작으로 되돌리는 공식 탈출구다. 고리를 끊으려면 주입 지점 한 곳에
# @Lazy 를 붙이면 되는데, 초기화 순서에 영향이 있어 마이그레이션 단계에서는 건드리지 않는다.
spring.main.allow-circular-references=true
