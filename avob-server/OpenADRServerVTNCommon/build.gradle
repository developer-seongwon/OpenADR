description = 'VTN 공통(엔티티, 서비스, REST, 브로커 설정). VTN20a, VTN20b 가 쓴다'

dependencies {
    api libs.openadr.httpclient

    // Jetty 를 걷어내고 부트 기본 컨테이너인 톰캣을 쓴다(서블릿 6). TLS 는 VtnSslBundleRegistrar 가
    // 등록하는 SSL 번들로 컨테이너 중립으로 처리한다
    api libs.spring.boot.starter.web
    api libs.spring.boot.starter.log4j2
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.data.jpa
    api libs.spring.boot.starter.validation
    api libs.spring.jms
    api libs.jakarta.jms.api
    // Boot 4 는 Jackson 3(tools.jackson.*)을 쓴다. VenCommandDto 의 @JsonCreator 는 Jackson 3 도 그대로 쓰는
    // com.fasterxml.jackson.annotation 패키지라 annotations 만 둔다
    api libs.jackson.annotations
    api libs.guava
    api libs.commons.compress

    // 브로커 라이브러리는 컴파일에만 쓰고 실행 jar 에 넣는 건 앱 모듈(VTN20b)이 정한다(libs.versions.toml 의 vtn-brokers 주석 참고)
    compileOnly libs.bundles.vtn.brokers

    // 테스트는 브로커 설정과 무관하게 항상 내장 ActiveMQ 로 돈다(VtnConfigEmbeddedBroker 가 @Profile test, standalone)
    testImplementation libs.bundles.vtn.brokers
    // 테스트 DB 는 H2 대신 도커로 운영과 같은 PostgreSQL 을 띄운다(운영과 같은 DB 라야 DDL 이 안 어긋난다)
    testImplementation libs.postgresql
    testImplementation libs.testcontainers.postgresql
    // 테스트용 DB 컨테이너 홀더. VTN20a, VTN20b 와 같은 것을 써야 컨텍스트마다 컨테이너를 새로 띄우지 않는다
    testImplementation project(':OpenADRServerVTNTestSupport')
    testImplementation libs.spring.security.test
    testImplementation libs.spring.boot.starter.test
}
