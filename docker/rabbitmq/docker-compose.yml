# RabbitMQ. VTN 과 DummyDRProgram 사이의 JMS 브로커(스프링 프로파일 external).
# 파일 안의 경로는 저장소 루트 기준이다(postgres/docker-compose.yml 주석 참고)
services:
  rabbitmq:
    build:
      # 빌드 컨텍스트는 저장소 루트다(cert 의 인증서를 COPY 한다)
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    # 호스트 포트는 9970 대(9973 AMQP, 9971 관리 화면). 컨테이너 안은 기본값(다른 컨테이너는 rabbitmq:5672 로 붙는다)
    ports:
      - "9973:5672"
      - "9971:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
