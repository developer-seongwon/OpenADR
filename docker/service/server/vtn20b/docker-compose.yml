# VTN 2.0b(웹 UI 포함). 파일 안의 경로는 저장소 루트 기준이다(docker/postgres/docker-compose.yml 주석 참고).
# 기동 순서: 인프라는 healthcheck 로 준비를 기다린다. 예전에는 depends_on 이 "컨테이너 시작"만 기다려서,
# Openfire 가 늦게 뜨면 VTN 의 XMPP 연결(XmppConnector)이 실패해 VTN 이 죽었다
services:
  vtn20b:
    # 빌드 컨텍스트는 이 디렉토리다(Dockerfile 과 설정 파일)
    build: docker/service/server/vtn20b
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      openfire:
        condition: service_healthy
    ports:
      - "8181:8181"
    networks:
      default:
      xmpp:
      http:
        aliases:
          - vtn.oadr.com

networks:
  http:
  xmpp:
