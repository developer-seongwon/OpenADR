# VTN 2.0b(웹 UI 포함). 파일 안의 경로는 저장소 루트 기준이다(docker/postgres/docker-compose.yml 주석 참고).
# 기동 순서: 인프라는 healthcheck 로 준비를 기다린다. 예전에는 depends_on 이 "컨테이너 시작"만 기다려서,
# Openfire 가 늦게 뜨면 VTN 의 XMPP 연결(XmppConnector)이 실패해 VTN 이 죽었다
services:
  vtn20b:
    # 빌드 컨텍스트는 이 디렉토리다(Dockerfile 과 설정 파일)
    build: docker/service/server/vtn20b
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      openfire:
        condition: service_healthy
    # VTN 은 컨테이너 안과 호스트 모두 9970 이다(application.properties 의 oadr.server.port)
    ports:
      - "9970:9970"
    # 9970 이 열리면 스프링 기동이 끝난 뒤다(내장 톰캣은 컨텍스트를 다 올린 뒤에 포트를 연다).
    # dummy-drprogram, dummy-ven20b 가 이걸 기다린다. 이미지에 curl 이 없어서 bash 의 /dev/tcp 로 본다
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9970"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      default:
      xmpp:
      http:
        aliases:
          - vtn.oadr.com

networks:
  http:
  xmpp:
