# DR 프로그램 흉내(VTN 뒤에 붙는 운영 시스템 자리). VTN REST API 로 이벤트를 만들고
# RabbitMQ 로 VEN 리포트를 받는다. 파일 안의 경로는 저장소 루트 기준이다(docker/postgres/docker-compose.yml 주석 참고)
services:
  dummy-drprogram:
    # 빌드 컨텍스트는 이 디렉토리다(Dockerfile 과 설정 파일)
    build: docker/service/server/dummy-drprogram
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      # VTN 이 실제로 응답할 때까지 기다린다. 기동할 때 VTN API 로 DummyMarketContext, VEN, 이벤트를 한 번만 만들고
      # 실패해도 다시 하지 않아서, 컨테이너만 뜬 VTN 에 붙으면 아무것도 안 생긴다
      vtn20b:
        condition: service_healthy
    networks:
      default:
      http:

networks:
  http:
