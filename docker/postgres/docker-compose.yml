# PostgreSQL. VTN(oadr-vtn20b 스키마)과 Openfire 가 같이 쓴다.
# run.sh 가 디렉토리마다 있는 docker-compose.yml 을 -f 로 모아 한 프로젝트(oadr)로 올린다.
# 파일 안의 경로는 저장소 루트 기준이다. compose 는 -f 여러 개의 상대 경로를 전부 한 기준 디렉토리로 풀어서
# run.sh 가 --project-directory 로 저장소 루트를 준다
services:
  postgres:
    build:
      # 빌드 컨텍스트는 저장소 루트다(cert 의 인증서를 COPY 한다)
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      - POSTGRES_PASSWORD=supersecure
    # 데이터를 named volume 에 둔다.
    # 볼륨이 없으면 컨테이너를 지우는 순간(docker compose down 등) 데이터도 같이 사라져서
    # DB 를 언제 비울지 스크립트가 정할 수 없었다. 볼륨으로 빼두면 컨테이너를 새로 만들어도
    # 데이터가 남고, 비우고 싶을 때만 run.sh 가 볼륨을 지운다.
    volumes:
      - pgdata:/var/lib/postgresql
    # 앱이 "컨테이너가 떴다"가 아니라 "받을 준비가 됐다"를 기다리게 한다(depends_on 의 condition).
    # -h 127.0.0.1 로 TCP 를 본다. 첫 기동 때 init-*.sh 를 도는 임시 서버는 유닉스 소켓만 열어서,
    # 소켓으로 보면 초기화가 끝나기 전에 준비됐다고 나온다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

# 볼륨 이름을 고정한다. run.sh 의 PGDATA_VOLUME 과 같아야 한다(reset-db 가 이 이름으로 지운다)
volumes:
  pgdata:
    name: oadr_pgdata
