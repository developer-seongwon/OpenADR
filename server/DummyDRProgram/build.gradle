apply plugin: 'org.springframework.boot'
apply plugin: 'org.openapi.generator'

description = '테스트용 DR 프로그램(VTN REST API 로 이벤트를 만든다). 도커 스택의 dummy-drprogram'

dependencies {
    implementation libs.openadr.security
    implementation libs.spring.boot.starter
    implementation libs.spring.boot.starter.log4j2
    implementation libs.spring.jms
    // amq 6.x 와 rabbitmq-jms 3.x 가 jakarta.jms 를 쓴다
    implementation libs.jakarta.jms.api
    // 브로커 클라이언트는 둘 다 넣는다. 어느 쪽에 붙을지는 스프링 프로파일(standalone, external)로 고른다
    // (DummyVTN20bControllerConfig). 메이븐 때도 provided 스코프라 실행 jar 에는 둘 다 들어갔다
    implementation libs.activemq.client
    implementation libs.rabbitmq.jms
    // 생성된 VTN REST 클라이언트가 쓰는 것. HTTP 는 자바 표준 java.net.http.HttpClient,
    // JSON 은 나머지 모듈과 같은 Jackson 3 다(java.time 지원이 databind 에 들어 있다)
    implementation libs.jackson.databind
    implementation libs.jakarta.annotation.api
}

// VTN REST 클라이언트를 openapi-generator 의 native 라이브러리로 만든다.
// 입력 스펙(swagger 2.0)은 springfox 시절 VTN 에서 뽑아 둔 것이고 생성 경고를 없애려고 두 군데를 손으로 고쳤다.
//   POST /Ven/, /Account/app, /Account/user 응답: 실제로는 인증서 tar 파일이라 "type": "file" 로 바꿨다(java.io.File 로 받는다)
//   /auth/*: RabbitMQ HTTP 인증 백엔드용 VTN 내부 API 라 뺐다(메서드 없는 @RequestMapping 이라 오퍼레이션이 28개 생겼다)
// 패키지 이름을 예전과 같게 두어서 DummyDRProgram 코드의 import 가 바뀌지 않는다
def openApiOutput = layout.buildDirectory.dir('generated/openapi')

openApiGenerate {
    generatorName = 'java'
    library = 'native'
    inputSpec = file('src/main/resources/oadr-vtn20b-0.1.0-SNAPSHOT.json').path
    outputDir = openApiOutput.get().asFile.path
    apiPackage = 'com.avob.server.oadrvtn20b.api'
    modelPackage = 'com.avob.server.oadrvtn20b.model'
    invokerPackage = 'com.avob.server.oadrvtn20b.handler'
    generateModelTests = false
    generateApiTests = false
    generateModelDocumentation = false
    generateApiDocumentation = false
    cleanupOutput = true
    configOptions = [
            sourceFolder           : 'src/main/java',
            useJakartaEe           : 'true',
            dateLibrary            : 'java8',
            // JsonNullable(jackson-databind-nullable) 의존성을 안 쓴다
            openApiNullable        : 'false',
            // 기본은 Jackson 2 다. 프로젝트 전체가 Jackson 3(tools.jackson)라 맞춘다
            useJackson3            : 'true',
            // 모델마다 toUrlQueryString 을 만드는 기능. 모델을 쿼리 문자열로 쓸 일이 없어서 끈다
            supportUrlQuery        : 'false',
            annotationLibrary      : 'none',
            serializableModel      : 'true',
            hideGenerationTimestamp: 'true',
    ]
}

sourceSets.main.java.srcDir(files(openApiOutput.map { it.dir('src/main/java') }).builtBy(tasks.named('openApiGenerate')))
