# 서버 모듈 버전 목록.
#
# 버전이 없는 항목은 Spring Boot BOM(spring-boot-dependencies) 값을 쓴다.
# BOM 은 Spring 팀이 서로 맞춰 검증한 조합이라 덮지 않는다. 최신이 필요하면 spring-boot 를 올린다.
# 예전에 덮던 것: activemq, junit-jupiter, byte-buddy, mockito, jackson-bom, commons-logging, commons-lang3,
# postgresql, testcontainers. 덮어 두면 Boot 를 올려도 그 값에 묶여서 오히려 버전이 내려간다
# (commons-lang3 고정 때문에 springdoc 3 이 쓰는 Strings 클래스가 없어 /v3/api-docs 가 500 이 났다).
# activemq 는 6.x 부터 jakarta.jms 다. testcontainers 는 2.x 라야 도커 엔진 29(API 1.44 이상)에 붙는다.
#
# client/gradle/libs.versions.toml 과 겹치는 값(spring-boot, jacoco)은 같게 유지한다.

[versions]
spring-boot = "4.1.1"
# 클라이언트 라이브러리(client/) 버전. 옆에 client 가 있으면 소스로 물고 들어가서 이 값은 좌표 맞추기용이다
openadr-client = "0.1.0-SNAPSHOT"
# jakarta.jms 대응 버전. Boot 가 관리하지 않는다
rabbitmq-jms = "3.9.0"
# springdoc 은 스프링 버전을 따라간다. 3.x 가 Boot 4(Spring 7) 대응이다.
# 어긋나면 빌드는 통과하고 런타임에 /v3/api-docs 가 500 으로 터진다
springdoc = "3.1.1"
guava = "33.7.1-jre"
commons-compress = "1.28.0"
jacoco = "0.8.15"
# DummyDRProgram 의 VTN REST 클라이언트 생성기
openapi-generator = "7.25.0"
# VTN20b 프론트엔드 빌드(node, npm 을 받아서 돌린다)
node-gradle = "7.1.0"
# React UI 를 빌드하는 node, npm. Vite 8 은 node 20.19 또는 22.12 이상을 요구한다.
# npm 은 이 node 에 번들된 버전과 맞춘다. Node 26 LTS 전환(10월 말) 뒤에 올린다
nodejs = "24.21.0"
npm = "11.19.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

openadr-security = { module = "com.avob.openadr:OpenADRSecurity", version.ref = "openadr-client" }
openadr-model20a = { module = "com.avob.openadr:OpenADRModel20a", version.ref = "openadr-client" }
openadr-model20b = { module = "com.avob.openadr:OpenADRModel20b", version.ref = "openadr-client" }
openadr-httpclient = { module = "com.avob.openadr:OpenADRHTTPClient", version.ref = "openadr-client" }
openadr-httpclient20a = { module = "com.avob.openadr:OpenADRHTTPClient20a", version.ref = "openadr-client" }
openadr-httpclient20b = { module = "com.avob.openadr:OpenADRHTTPClient20b", version.ref = "openadr-client" }
openadr-xmppclient = { module = "com.avob.openadr:OpenADRXMPPClient", version.ref = "openadr-client" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-jms = { module = "org.springframework:spring-jms" }
spring-test = { module = "org.springframework:spring-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
jakarta-jms-api = { module = "jakarta.jms:jakarta.jms-api" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

activemq-broker = { module = "org.apache.activemq:activemq-broker" }
activemq-client = { module = "org.apache.activemq:activemq-client" }
rabbitmq-jms = { module = "com.rabbitmq.jms:rabbitmq-jms", version.ref = "rabbitmq-jms" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core" }

[bundles]
# VTN 이 쓰는 브로커 라이브러리. 둘 다 실행 jar 에 넣고 어느 쪽을 쓸지는 스프링 프로파일로만 고른다
# (standalone 은 ActiveMQ 내장 브로커, external 은 RabbitMQ. 안 쓰는 쪽 설정 클래스는 @Profile 로 꺼진다).
# 메이븐 때는 메이븐 프로파일(standalone, external)로 둘 중 하나만 jar 에 넣었는데, 도커용 빌드에서
# -P external 을 빼먹거나 IntelliJ 가 만든 standalone jar 가 남아 있으면 VTN 이 기동 중에
# RMQConnectionFactory 를 못 찾고 죽었다
vtn-brokers = ["activemq-broker", "rabbitmq-jms"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
