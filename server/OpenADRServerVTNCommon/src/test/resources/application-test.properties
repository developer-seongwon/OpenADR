# H2 임베디드일 때는 부트가 ddl-auto 를 create-drop 으로 알아서 잡아줬지만,
# PostgreSQL 은 임베디드가 아니라 기본값이 none 이다. 명시하지 않으면 테이블이 안 생긴다.
spring.jpa.hibernate.ddl-auto create-drop
