apply plugin: 'org.springframework.boot'
apply plugin: 'com.github.node-gradle.node'

description = 'OpenADR 2.0b VTN(웹 UI 포함). 도커 스택의 vtn20b'

dependencies {
    implementation libs.openadr.httpclient20b
    implementation libs.openadr.xmppclient
    implementation project(':OpenADRServerVTNCommon')
    // springfox 는 Boot 3 에서 기동조차 못 해 springdoc 으로 바꿨다. UI 까지 한 아티팩트에 들어 있다
    implementation libs.springdoc.webmvc.ui

    // 브로커는 둘 다 넣고 스프링 프로파일로 고른다(libs.versions.toml 의 vtn-brokers 주석 참고).
    // 임베디드 H2 를 걷어내고 운영과 같은 PostgreSQL 을 쓴다
    implementation libs.bundles.vtn.brokers
    runtimeOnly libs.postgresql

    testImplementation project(':OpenADRServerVTNTestSupport')
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.spring.security.test
    testImplementation libs.spring.boot.starter.test
}

springBoot {
    mainClass = 'com.avob.openadr.server.oadr20b.vtn.VTN20bApplication'
}

// 도커 이미지가 loader.path 로 외부 lib 디렉토리의 jar 를 얹을 수 있게 PropertiesLauncher 로 띄운다.
// 메이븐 때 layout ZIP 이 하던 일이다(Start-Class 는 위 mainClass 가 들어간다)
tasks.named('bootJar') {
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
    }
}

// React UI(frontend). Vite 로 빌드해서 jar 의 public/ 에 넣는다. 스프링이 /testvtn/ 아래로 서빙한다.
// -Pfrontend=false 면 건너뛴다(테스트만 돌릴 때 빠르다. 그 jar 에는 UI 가 없다)
def withFrontend = providers.gradleProperty('frontend').map { it != 'false' }.getOrElse(true)

node {
    version = libs.versions.nodejs.get()
    npmVersion = libs.versions.npm.get()
    download = true
    // node 배포본 저장소는 settings.gradle 에 적었다(FAIL_ON_PROJECT_REPOS)
    distBaseUrl = null
    nodeProjectDir = file('frontend')
    workDir = layout.buildDirectory.dir('nodejs')
    npmWorkDir = layout.buildDirectory.dir('npm')
}

def frontendBuild = tasks.register('frontendBuild', com.github.gradle.node.npm.task.NpmTask) {
    description = 'React UI 를 빌드한다(npm run build, 결과는 frontend/build)'
    group = 'build'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.dir('frontend/src').withPropertyName('src').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('frontend/public').withPropertyName('public').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json', 'frontend/vite.config.mjs')
            .withPropertyName('config').withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir('frontend/build').withPropertyName('build')
    outputs.cacheIf { true }
}

tasks.named('processResources', ProcessResources) {
    // 메이븐 때 antrun 이 frontend/build 를 복사해 두던 곳. 지금은 안 쓴다. 남아 있는 옛 번들이 jar 에 섞이지 않게 뺀다
    exclude 'public/**'
    if (withFrontend) {
        from(frontendBuild) {
            into 'public'
        }
    }
}

tasks.named('test', Test) {
    jacoco {
        excludes = ['*.EmbeddedSqlDatabaseInit*', '*.SwaggerConfig*']
    }
}
